[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Security headers for the whole site. No third-party scripts, fonts or trackers.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/en/book/manage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/prenota/gestisci/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Language. Italian is at the root, English under /en/. On the home page only,
# browsers whose language is not Italian go to the English site. Netlify rules
# can't express "not Italian", so this lists the common languages; anything
# else (and crawlers, which send no language) stays on the Italian home page.
# A choice made with the language switch is kept in the nf_lang cookie, which
# Netlify reads instead of the browser language.
# An explicit choice of Italian (the language switch links to /?lang=it) is
# never sent to English, whatever the browser or the cookies say.
# Old one-page-per-service addresses: the overview page now has a section per area.
[[redirects]]
  from = "/servizi/:slug/"
  to = "/servizi/"
  status = 301
[[redirects]]
  from = "/servizi/:slug"
  to = "/servizi/"
  status = 301

# Pages merged or removed in the v4 site (7/11/2026).
[[redirects]]
  from = "/costi-e-faq/"
  to = "/tariffe-e-prenotazioni/"
  status = 301
[[redirects]]
  from = "/online/"
  to = "/tariffe-e-prenotazioni/#online"
  status = 301
[[redirects]]
  from = "/primo-colloquio/"
  to = "/tariffe-e-prenotazioni/#come-si-prenota"
  status = 301
[[redirects]]
  from = "/studio/"
  to = "/contatti/"
  status = 301
[[redirects]]
  from = "/come-lavoriamo/"
  to = "/servizi/"
  status = 301

# The career page moved to an Italian address (7/11/2026).
[[redirects]]
  from = "/lavoro/"
  to = "/orientamento-carriera/"
  status = 301

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  query = {lang = "it"}

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = {Language = ["en", "fr", "de", "es", "pt", "nl", "pl", "ro", "ru", "uk", "zh", "ja", "ko", "ar", "tr", "el", "sv", "da", "no", "nb", "fi", "cs", "sk", "hu", "bg", "hr", "sr", "sl", "sq", "he", "hi", "bn", "ur", "fa", "vi", "th", "id", "ms", "tl", "lt", "lv", "et", "ca"]}

# English visitors on a missing page see the English 404.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

# Preview deploys are never indexed.
[context.deploy-preview.environment]
  SITE_DEMO = "true"
